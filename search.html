<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - Object Show Streaming</title>
    <style>
        body { background-color: #040714; color: #f9f9f9; font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; margin: 0; padding-bottom: 80px; -webkit-font-smoothing: antialiased; }
        nav { position: sticky; top: 0; z-index: 50; background-color: #040714; padding: 16px 40px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1f2937; }
        .logo { font-size: 1.25rem; font-weight: 900; letter-spacing: 0.1em; color: #00ebfe; text-decoration: none; margin-right: 32px; }
        .nav-links { display: flex; gap: 24px; }
        .nav-links a { color: #d1d5db; text-decoration: none; font-size: 0.85rem; font-weight: 600; letter-spacing: 0.05em; }
        .nav-links a:hover { color: #ffffff; }
        .search-container { max-width: 800px; margin: 60px auto 40px auto; padding: 0 20px; text-align: center; }
        .search-bar { width: 100%; max-width: 600px; padding: 16px 24px; background-color: #4b5563; border: 2px solid transparent; border-radius: 9999px; color: white; font-size: 1.2rem; outline: none; transition: border-color 0.2s; }
        .search-bar:focus { border-color: #00ebfe; }
        .results-grid { max-width: 1200px; margin: 0 auto; padding: 0 40px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .video-card { background-color: #1a1d29; border: 1px solid #1f2937; border-radius: 8px; overflow: hidden; display: block; transition: border-color 0.2s; }
        .video-card:hover { border-color: #9ca3af; }
        .video-wrapper { position: relative; width: 100%; padding-bottom: 56.25%; background-color: #000000; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .video-meta { padding: 12px; }
        .video-meta h3 { font-size: 0.875rem; font-weight: 700; margin: 0 0 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .video-meta p { font-size: 0.75rem; color: #9ca3af; margin: 0; }
    </style>
</head>
<body>

    <nav>
        <div style="display: flex; align-items: center;">
            <a href="/" class="logo">OBJECT SHOW STREAMING</a>
            <div class="nav-links">
                <a href="/">🏠 HOME</a>
                <a href="/search" style="color: #00ebfe;">🔍 SEARCH</a>
                <a href="/browse">✨ BROWSE</a>
            </div>
        </div>
    </nav>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-bar" placeholder="Type show names or creators..." onkeyup="filterShows()">
    </div>

    <!-- MAIN SEARCH GRID: Add your new items right here -->
    <div class="results-grid" id="resultsGrid">
        
        <!-- CARD 1 -->
        <div class="video-card" data-title="bfdi episode 1 take the plunge jacknjellify">
            <div class="video-wrapper">
                <iframe src="https://youtube.com" allowfullscreen></iframe>
            </div>
            <div class="video-meta">
                <h3>BFDI Episode 1: Take the Plunge</h3>
                <p>jacknjellify</p>
            </div>
        </div>

        <!-- CARD 2 -->
        <div class="video-card" data-title="inanimate insanity season 1 episode 1 animationepic">
            <div class="video-wrapper">
                <iframe src="https://youtube.com" allowfullscreen></iframe>
            </div>
            <div class="video-meta">
                <h3>Inanimate Insanity Season 1 Episode 1</h3>
                <p>AnimationEpic</p>
            </div>
        </div>

    </div>

    <script>
        function filterShows() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('video-card');
            for (let i = 0; i < cards.length; i++) {
                let searchTerms = cards[i].getAttribute('data-title');
                if (searchTerms.includes(input)) {
                    cards[i].style.display = "block";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
    </script>
</body>
</html>
