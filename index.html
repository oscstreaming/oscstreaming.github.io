<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSC Stream - Object Show Hub</title>
    <style>
        /* Modern Dark Mode Streaming Style */
        body {
            background-color: #141414;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 2px solid #E50914; /* Streaming red accent */
        }

        h1 {
            margin: 0;
            font-size: 2.5rem;
            color: #E50914;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Active Video Theater Player Section */
        .video-player-container {
            background-color: #000000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 40px;
        }

        .responsive-iframe {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
        }

        .responsive-iframe iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .player-info {
            padding: 15px;
            background-color: #1f1f1f;
        }

        /* Show Grid Catalog Layout */
        .show-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .show-card {
            background-color: #1f1f1f;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            border: 1px solid #333;
        }

        .show-card:hover {
            transform: scale(1.03);
            box-shadow: 0 5px 15px rgba(229, 9, 20, 0.4);
            border-color: #E50914;
        }

        .show-thumbnail {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background-color: #333;
        }

        .show-details {
            padding: 15px;
        }

        .show-title {
            margin: 0 0 5px 0;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .show-creator {
            color: #aaa;
            font-size: 0.9rem;
            margin: 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>OBJECT STREAM Hub</h1>
        <p>A safe, ad-free place to stream community Object Shows</p>
    </header>

    <div class="container">
        
        <!-- THEATER PLAYER (Updates automatically when a card below is clicked) -->
        <div class="video-player-container">
            <div class="responsive-iframe">
                <!-- Uses standard YouTube embed URL structure -->
                <iframe id="mainPlayer" src="https://youtube.com" allowfullscreen></iframe>
            </div>
            <div class="player-info">
                <h2 id="playerTitle" style="margin:0;">Select a show below to start watching!</h2>
            </div>
        </div>

        <h2 style="border-left: 4px solid #E50914; padding-left: 10px; margin-bottom: 20px;">Discover Shows</h2>
        
        <!-- CATALOG GRID -->
        <div class="show-grid">
            
            <!-- SHOW CARD 1 -->
            <div class="show-card" onclick="changeVideo('https://youtube.com', 'Battle for Dream Island - Episode 1')">
                <img class="show-thumbnail" src="https://youtube.com" alt="BFDI Thumbnail">
                <div class="show-details">
                    <p class="show-title">Battle for Dream Island</p>
                    <p class="show-creator">By jacknjellify</p>
                </div>
            </div>

            <!-- SHOW CARD 2 -->
            <div class="show-card" onclick="changeVideo('https://youtube.com', 'Inanimate Insanity - Episode 1')">
                <img class="show-thumbnail" src="https://youtube.com" alt="II Thumbnail">
                <div class="show-details">
                    <p class="show-title">Inanimate Insanity</p>
                    <p class="show-creator">By AnimationEpic</p>
                </div>
            </div>

            <!-- Add more show cards here following the exact same structure! -->

        </div>
    </div>

    <!-- JAVASCRIPT FOR STREAMING CONTROLS -->
    <script>
        function changeVideo(embedUrl, showTitle) {
            // Changes the iframe source link to the new show
            document.getElementById('mainPlayer').src = embedUrl;
            // Updates the visible title text underneath the theater player
            document.getElementById('playerTitle').innerText = showTitle;
            // Smoothly scrolls back up to the top player if the user is deep in the catalog
            window.scrollTo({top: 0, behavior: 'smooth'});
        }
    </script>

</body>
</html>
