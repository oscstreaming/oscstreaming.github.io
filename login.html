<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Object Show Plus</title>
    <style>
        body {
            background-color: #040714;
            color: #f9f9f9;
            font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .login-box {
            background-color: #1a1d29;
            padding: 40px;
            border-radius: 8px;
            border: 1px solid #1f2937;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
            width: 320px;
        }
        h2 { color: #00ebfe; margin-bottom: 24px; font-weight: 800; }
        button {
            width: 100%;
            height: 45px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: none;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .google { background-color: #ffffff; color: #757575; }
        .microsoft { background-color: #2f2f2f; color: #ffffff; }
        .apple { background-color: #000000; color: #ffffff; }
        .back-btn { display: inline-block; color: #9ca3af; text-decoration: none; margin-top: 20px; font-size: 0.85rem; }
        .back-btn:hover { color: white; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Sign In</h2>
        <button class="google" onclick="alert('Google Sign-In Connected!')">
            <img src="https://wikimedia.org" width="18" height="18"> Sign in with Google
        </button>
        <button class="microsoft" onclick="alert('Microsoft Sign-In Connected!')">
            <img src="https://wikimedia.org" width="18" height="18"> Sign in with Microsoft
        </button>
        <button class="apple" onclick="alert('Apple Sign-In Connected!')">
            <img src="https://wikimedia.org" width="18" height="18" style="filter: invert(1);"> Sign in with Apple
        </button>
        <a href="index.html" class="back-btn">← Back to Home</a>
    </div>
</body>
</html>
