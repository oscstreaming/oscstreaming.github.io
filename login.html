<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Object Show Streaming</title>
    <style>
        body {
            background-color: #040714;
            color: #f9f9f9;
            font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        .gateway-box {
            background-color: #1a1d29;
            padding: 40px;
            border-radius: 8px;
            border: 1px solid #1f2937;
            width: 340px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
        }
        h2 { color: #00ebfe; margin: 0 0 20px 0; font-weight: 800; font-size: 1.8rem; text-align: center; }
        label { display: block; margin: 14px 0 6px 0; font-size: 0.8rem; color: #9ca3af; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
        input {
            width: 100%;
            padding: 12px;
            background-color: #31343e;
            border: 1px solid #4b5563;
            border-radius: 4px;
            color: white;
            box-sizing: border-box;
            outline: none;
            font-size: 0.95rem;
        }
        input:focus { border-color: #00ebfe; }
        button {
            width: 100%;
            padding: 14px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            margin-top: 24px;
            cursor: pointer;
            border: none;
            background-color: #2563eb;
            color: white;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #3b82f6; }
        .toggle-text { text-align: center; margin-top: 20px; font-size: 0.85rem; color: #9ca3af; }
        .toggle-text span { color: #00ebfe; cursor: pointer; font-weight: bold; }
        .toggle-text span:hover { text-decoration: underline; }
        .back-btn { display: block; text-align: center; color: #6b7280; text-decoration: none; margin-top: 24px; font-size: 0.85rem; }
        .back-btn:hover { color: white; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="gateway-box">
        <!-- 1. LOGIN INTERFACE -->
        <div id="loginSection">
            <h2>Sign In</h2>
            <label>Email Address</label>
            <input type="email" id="loginEmail" placeholder="name@example.com">
            
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="••••••••">
            
            <button onclick="handleLogin()">Sign In</button>
            <div class="toggle-text">New to Object Show Streaming? <span onclick="toggleForms()">Sign up now</span></div>
        </div>

        <!-- 2. SIGN UP INTERFACE -->
        <div id="signupSection" class="hidden">
            <h2>Create Account</h2>
            <label>Email Address</label>
            <input type="email" id="signupEmail" placeholder="name@example.com">
            
            <label>Password</label>
            <input type="password" id="signupPassword" placeholder="Minimum 6 characters">

            <!-- Added Phone Number field -->
            <label>Phone Number (Optional)</label>
            <input type="tel" id="signupPhone" placeholder="+1 123 456 7890">
            
            <button onclick="handleSignup()">Create Account</button>
            <div class="toggle-text">Already have an account? <span onclick="toggleForms()">Sign in</span></div>
        </div>

        <a href="/" class="back-btn">← Back to Home</a>
    </div>

    <!-- Firebase System Modules -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://gstatic.com";

        // Place your unique project configuration keys down here:
        const firebaseConfig = {
            apiKey: "AIzaSyDL2ZySqmdhrGO0FfEi2bMcAYbKTrhDuaQ",
            authDomain: "oscstreamingservice.firebaseapp.com",
            projectId: "oscstreamingservice",
            storageBucket: "oscstreamingservice.firebasestorage.app",
            messagingSenderId: "392974088778",
            appId: "1:392974088778:web:b69c66acba7ed4ebf144b3",
            measurementId: "G-M3LL6RNC89",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Core UI Navigation Toggle
        window.toggleForms = function() {
            document.getElementById('loginSection').classList.toggle('hidden');
            document.getElementById('signupSection').classList.toggle('hidden');
        }

        // Email Account Registration Processing
        window.handleSignup = function() {
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const phone = document.getElementById('signupPhone').value; // Saved phone value
            
            if(!email || !password) return alert("Please fill out your required email and password.");
            
            createUserWithEmailAndPassword(auth, email, password)
                .then(() => { 
                    alert("🎉 Account created successfully! Welcome to Object Show Streaming."); 
                    window.location.href = "/"; 
                })
                .catch((err) => alert(err.message));
        }

        // Email Account Logins Processing
        window.handleLogin = function() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            if(!email || !password) return alert("Please enter your login details.");
            
            signInWithEmailAndPassword(auth, email, password)
                .then(() => { 
                    alert("👋 Welcome back!"); 
                    window.location.href = "/"; 
                })
                .catch((err) => alert("Login Failed: " + err.message));
        }
    </script>
</body>
</html>
